# NCA's container stack: one compose setup for dev now, and production
# eventually.
#
# - Configuration lives in `.env` (copy `.env.example`), interpolated here so
#   each value is set in one place. Required values use `:?`, so the stack
#   refuses to start without them. Never set environment variables in
#   compose.override.yml; it's only for structural changes (published ports,
#   host-directory volumes, logging, the dev build target). If a setting you
#   need isn't exposed here, add it here and to `.env.example`.
# - This targets podman (podman-compose 1.6.0 or newer). Older podman-compose
#   ignores COMPOSE_PROFILES; on a server stuck with one, run compose via
#   `scripts/compose`, which works around it.
# - Logging is up to the override. Production's sends each service to its own
#   log file (see "Containers" in the docs, hugo/content/setup/containers.md),
#   so logs survive `down` and container recreation. Dev uses podman's default
#   log driver, so `podman compose logs` works, but nothing piles up.
# - Long-running services use `restart: always`, not "unless-stopped":
#   podman-restart.service only honors "always".
# - Every mount is a top-level named volume. Environments that need host
#   directories redefine the volume in their override (see
#   compose.override.example.yml) rather than adding inline binds here.
# - Shared settings use YAML merge keys (`<<: *nca`), *not* `extends`:
#   podman-compose's `extends` shallow-copies, so nested maps leak between
#   services. `<<:` merges one level deep: a service that sets `environment:`
#   must start it with `<<: *nca-env`.
#
# Profiles (set COMPOSE_PROFILES in `.env`):
#
# - (none): what production needs: proxy, web, workers, db, and iiif
# - sftpgo: SFTPGo for publisher uploads, if it isn't run elsewhere
# - local-dev: staging and production ONI stacks plus their agents, so
#   batches have somewhere to go. NEVER enable this in production.
# - tools: the "cli" service for one-off commands (see below)
#
# Env values for profiled services must use `:-`, never `:?`: podman-compose
# interpolates services even when their profile is off.

networks:
  nca: {}
  oni-staging: {}
  oni-prod: {}

# Settings for every NCA service (web, workers, cli). They override the
# image's settings file (settings-example, verbatim). Every setting that can
# differ between environments is here, interpolated from .env. Binary paths,
# workflow paths, template paths, and internal service addresses aren't: the
# image and this file fix those.
x-nca-env: &nca-env
  # Public URLs, as a browser sees them. NCA may live under a path, but page
  # images are always at /images/iiif from the stack's root.
  NCA_WEBROOT: ${PUBLIC_URL:?PUBLIC_URL must be set}${NCA_URL_PATH:-}
  NCA_IIIF_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL must be set}/images/iiif
  NCA_NEWS_WEBROOT: ${NEWS_WEBROOT:?NEWS_WEBROOT must be set}
  NCA_STAGING_NEWS_WEBROOT: ${STAGING_NEWS_WEBROOT:?STAGING_NEWS_WEBROOT must be set}

  # Internal services
  NCA_DB_HOST: db
  NCA_DB_PORT: 3306
  NCA_DB_USER: nca
  NCA_DB_DATABASE: nca
  NCA_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
  NCA_SFTPGO_API_URL: ${SFTPGO_API_URL:?SFTPGO_API_URL must be set (use "-" to disable SFTPGo integration)}
  NCA_SFTPGO_ADMIN_API_KEY: ${SFTPGO_ADMIN_API_KEY:-}
  NCA_STAGING_AGENT: ${STAGING_AGENT:?STAGING_AGENT must be set}
  NCA_PRODUCTION_AGENT: ${PRODUCTION_AGENT:?PRODUCTION_AGENT must be set}

  # Workflow rules
  NCA_PDF_BATCH_MARC_ORG_CODE: ${PDF_BATCH_MARC_ORG_CODE:?PDF_BATCH_MARC_ORG_CODE must be set}
  NCA_MIN_BATCH_SIZE: ${MIN_BATCH_SIZE:-5000}
  NCA_MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-10000}
  NCA_DURATION_ISSUE_CONSIDERED_DANGEROUS: ${DURATION_ISSUE_CONSIDERED_DANGEROUS:-48h}
  NCA_DURATION_ISSUE_CONSIDERED_NEW: ${DURATION_ISSUE_CONSIDERED_NEW:-336h}
  NCA_MINIMUM_ISSUE_PAGES: ${MINIMUM_ISSUE_PAGES:-2}
  NCA_SFTPGO_NEW_USER_QUOTA: ${SFTPGO_NEW_USER_QUOTA:-5gb}

  # New titles' MARC records. These have no defaults here because
  # podman-compose can't put "}" (as in "{{lccn}}") in one.
  NCA_MARC_LOCATION_1: ${MARC_LOCATION_1:?MARC_LOCATION_1 must be set}
  NCA_MARC_LOCATION_2: ${MARC_LOCATION_2:?MARC_LOCATION_2 must be set}

  # Derivatives
  NCA_DPI: ${DPI:-200}
  NCA_QUALITY: ${QUALITY:-62.5}
  NCA_SCANNED_PDF_DPI: ${SCANNED_PDF_DPI:-150}

  # Layout: settings-example's paths already match the "news" volume, except
  # production batches, which live in their own volume since ONI needs them
  NCA_BATCH_PRODUCTION_PATH: /mnt/batches

x-nca: &nca
  build:
    context: .
    dockerfile: docker/Dockerfile-app
    args:
      NCA_VERSION: ${NCA_VERSION:-unknown}
  environment: *nca-env
  networks:
    nca: {}
  # The workflow and batch output paths *must* share a mount: batches are
  # built by hard-linking issue files, which fails across mounts, even when
  # both mounts are the same filesystem underneath.
  volumes:
    - news:/mnt/news
    - batches:/mnt/batches
    - issue-cache:/var/local/news/nca/cache
    - locks:/var/local/nca/locks

services:
  #####
  # NCA
  #####

  # Caddy: the only published HTTP port. Routes page images to RAIS and
  # everything else to NCA. See docker/caddy/Caddyfile for the security
  # requirements around authentication.
  proxy:
    restart: always
    build:
      context: .
      dockerfile: docker/Dockerfile-caddy
    environment:
      CADDY_DEBUG: ${CADDY_DEBUG:-}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-static private_ranges}
    depends_on:
      - web
      - iiif
    networks:
      nca: {}

  # The NCA web server. Migrates the database before starting.
  web:
    <<: *nca
    restart: always
    command: ["server"]
    environment:
      <<: *nca-env
      # Lets anybody act as any user. NEVER enable this in production.
      NCA_DEBUG: ${NCA_DEBUG:-false}
    depends_on:
      - db
      - iiif

  # The job runner. Migrates the database before starting.
  workers:
    <<: *nca
    restart: always
    command: ["run-jobs", "watchall"]
    depends_on:
      - db

  # One-off commands: any NCA binary, or anything else in the image. The
  # config file is already set (NCA_CONFIG), so there's no need for "-c":
  #
  #   podman compose --profile tools run --rm --no-deps cli queue-batches
  #
  # Keep `--no-deps`, so a one-off never starts services stopped on purpose.
  cli:
    <<: *nca
    profiles: [tools]
    command: ["echo", "Usage: podman compose --profile tools run --rm --no-deps cli <command> [args...]"]

  db:
    restart: always
    build:
      context: .
      dockerfile: docker/Dockerfile-db
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: nca
      MARIADB_USER: nca
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - db:/var/lib/mysql
    networks:
      nca: {}

  # RAIS: serves the workflow's JP2s to NCA's metadata pages
  iiif:
    restart: always
    image: docker.io/uolibraries/rais:4-alpine
    environment:
      RAIS_IIIFBASEURL: ${PUBLIC_URL:?PUBLIC_URL must be set}
      RAIS_IIIFWEBPATH: /images/iiif
      RAIS_TILECACHELEN: 250
      RAIS_TILEPATH: /mnt/news/workflow
    volumes:
      - news:/mnt/news:ro
    networks:
      nca: {}

  # SFTPGo ("sftpgo" profile): publisher uploads land in the news volume's
  # sftp dir, where NCA expects them. It runs as root because, under rootless
  # podman, that's the host user, so its files stay ours on a host bind.
  sftpgo:
    profiles: [sftpgo]
    restart: always
    build:
      context: .
      dockerfile: docker/Dockerfile-sftpgo
    user: "0:0"
    environment:
      SFTPGO_DATA_PROVIDER__USERS_BASE_DIR: /mnt/news/sftp
      # Dev only: seeds a known admin and API key. See .env.example.
      SFTPGO_LOADDATA_FROM: ${SFTPGO_LOADDATA_FROM:-}
    volumes:
      - news:/mnt/news
      - sftpgo-home:/var/lib/sftpgo
      - sftpgo-backups:/srv/sftpgo/backups
    networks:
      nca: {}

  #####
  # Local dev only ("local-dev" profile): two ONI stacks, staging and
  # production, each with an agent NCA talks to. Both ONIs share one RAIS.
  #####

  oni-agent-staging:
    profiles: [local-dev]
    build:
      context: .
      dockerfile: docker/Dockerfile-oni
      target: agent
    environment:
      BA_BIND: ":22"
      HOST_KEY_FILE: /etc/rsa/oni-agent
      ONI_LOCATION: /opt/openoni/
      BATCH_SOURCE: /mnt/batches
      DB_CONNECTION: openoni:openoni@tcp(oni-staging-db:3306)/openoni
    volumes:
      - batches:/mnt/batches
      - agent-staging-rsa:/etc/rsa/
    depends_on:
      - oni-staging-db
      - oni-staging-solr
    networks:
      oni-staging: {}
      nca: {}

  oni-agent-prod:
    profiles: [local-dev]
    build:
      context: .
      dockerfile: docker/Dockerfile-oni
      target: agent
    environment:
      BA_BIND: ":22"
      HOST_KEY_FILE: /etc/rsa/oni-agent
      ONI_LOCATION: /opt/openoni/
      BATCH_SOURCE: /mnt/batches
      DB_CONNECTION: openoni:openoni@tcp(oni-prod-db:3306)/openoni
    volumes:
      - batches:/mnt/batches
      - agent-prod-rsa:/etc/rsa/
    depends_on:
      - oni-prod-db
      - oni-prod-solr
    networks:
      oni-prod: {}
      nca: {}

  oni-staging:
    profiles: [local-dev]
    build:
      context: .
      dockerfile: docker/Dockerfile-oni
      target: oni
    environment:
      APACHE_LOG_LEVEL: info
      ONI_DEBUG: "1"
      ONI_BASE_URL: ${ONI_STAGING_URL:-}
      ONI_IIIF_URL: ${ONI_PROD_URL:-}/images/iiif
    volumes:
      - batches:/mnt/batches
    depends_on:
      - oni-staging-db
      - oni-staging-solr
      - oni-iiif
    networks:
      oni-staging: {}

  oni-staging-db:
    profiles: [local-dev]
    image: docker.io/library/mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: openoni
      MYSQL_USER: openoni
      MYSQL_PASSWORD: openoni
    volumes:
      - oni-staging-data-mariadb:/var/lib/mysql
    networks:
      oni-staging:
        aliases:
          - rdbms

  oni-staging-solr:
    profiles: [local-dev]
    image: docker.io/library/solr:8-slim
    command: ["solr-precreate", "openoni"]
    volumes:
      - oni-staging-data-solr:/var/solr
    networks:
      oni-staging:
        aliases:
          - solr

  oni-prod:
    profiles: [local-dev]
    build:
      context: .
      dockerfile: docker/Dockerfile-oni
      target: oni
    environment:
      APACHE_LOG_LEVEL: warn
      ONI_DEBUG: "0"
      ONI_BASE_URL: ${ONI_PROD_URL:-}
      ONI_IIIF_URL: ${ONI_PROD_URL:-}/images/iiif
    volumes:
      - batches:/mnt/batches
    depends_on:
      - oni-prod-db
      - oni-prod-solr
      - oni-iiif
    networks:
      oni-prod: {}

  oni-prod-db:
    profiles: [local-dev]
    image: docker.io/library/mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: openoni
      MYSQL_USER: openoni
      MYSQL_PASSWORD: openoni
    volumes:
      - oni-prod-data-mariadb:/var/lib/mysql
    networks:
      oni-prod:
        aliases:
          - rdbms

  oni-prod-solr:
    profiles: [local-dev]
    image: docker.io/library/solr:8-slim
    command: ["solr-precreate", "openoni"]
    volumes:
      - oni-prod-data-solr:/var/solr
    networks:
      oni-prod:
        aliases:
          - solr

  # One RAIS for both ONIs, since they share the batch volume. Its base URL is
  # production ONI's, so staging's page images come through production too.
  oni-iiif:
    profiles: [local-dev]
    image: docker.io/uolibraries/rais:4-alpine
    environment:
      RAIS_IIIFBASEURL: ${ONI_PROD_URL:-}
      RAIS_IIIFWEBPATH: /images/iiif
      RAIS_TILECACHELEN: 250
      RAIS_TILEPATH: /mnt/batches
    volumes:
      - batches:/mnt/batches:ro
    networks:
      oni-staging:
        aliases:
          - rais
      oni-prod:
        aliases:
          - rais

volumes:
  # NCA's workflow tree: uploads (sftp, scans), page review, the workflow
  # itself, outgoing batches, the batch archive, backups, and errors. In
  # production this is the network storage NCA's paths live on.
  news: {}
  # Batches' live files, which both ONIs (and their agents) need
  batches: {}
  issue-cache: {}
  locks: {}
  db: {}
  sftpgo-home: {}
  sftpgo-backups: {}
  oni-staging-data-mariadb: {}
  oni-staging-data-solr: {}
  oni-prod-data-mariadb: {}
  oni-prod-data-solr: {}
  agent-staging-rsa: {}
  agent-prod-rsa: {}
