# Copy this to `compose.override.yml`. This is dev-centric: for development it
# can work mostly as-is.
#
# For production, start fresh. Don't use this at all. You only want to expose a
# limited set of services, you won't have (and don't want) the ONI services,
# you may or may not want host-mounted volumes, etc.
#
# **Note**: overrides are for *structural* changes only, never configuration.

# Dev magic: web, workers, and cli run the "dev" image target with your
# checkout mounted over the app directory. The entrypoint recompiles whatever
# binary a container runs, so the edit/compile/test loop is:
#
#   podman compose restart web workers
#
# The named volumes keep Go's caches between runs, and keep the container's
# binaries out of your checkout's bin/ directory.
#
# Note that if you don't run the various profiles, you *still* need to set all
# required env vars. Profiled services still interpolate values, unfortunately.
#
# Never do this in production.
x-nca-dev: &nca-dev
  build:
    target: dev
  volumes:
    - .:/usr/local/nca
    - go-cache:/root/.cache
    - dev-bin:/usr/local/nca/bin

services:
  # NCA, plus page images at /images/iiif. In dev, the browser talks straight
  # to the proxy, so it's published on PUBLIC_PORT.
  proxy:
    ports:
      - "${PUBLIC_PORT:?PUBLIC_PORT must be set}:80"

  web: *nca-dev
  workers: *nca-dev
  cli: *nca-dev

  # SFTPGo's web admin (login "admin", password "password" with the dev seed),
  # and SFTP for test uploads.
  sftpgo:
    ports:
      - "${SFTPGO_WEB_PORT:?SFTPGO_WEB_PORT must be set}:8080"
      - "${SFTPGO_SFTP_PORT:?SFTPGO_SFTP_PORT must be set}:2022"

  # ONI production and staging
  oni-prod:
    ports:
      - "${ONI_PROD_PORT:?ONI_PROD_PORT must be set}:80"
  oni-staging:
    ports:
      - "${ONI_STAGING_PORT:?ONI_STAGING_PORT must be set}:80"

  # Uncomment for direct database access
  #db:
  #  ports:
  #    - "127.0.0.1:3306:3306"

volumes:
  # Go build and module caches, and the dev image's compiled binaries
  go-cache: {}
  dev-bin: {}

  # Redefine the volumes we want mounted locally so we aren't trying to
  # redefine everything service-by-service. Stick to DEV-VOLS unless you really
  # can't: it's what we ignore for git and docker, and what docs assume.
  news:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/DEV-VOLS/news
  batches:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/DEV-VOLS/batches

  # The issue cache lives on the host so wiping the stack, even with `podman
  # compose down -v`, doesn't mean a long (10+ minute) wait while NCA rebuilds
  # it from the live site. The test stack copies this to start its own cache.
  issue-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/DEV-VOLS/issue-cache
