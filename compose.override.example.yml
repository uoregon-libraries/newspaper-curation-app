# Copy this to `compose.override.yml` for local development.
#
# Overrides are for *structural* changes only: published ports, host-directory
# volumes, and the dev build target. All configuration goes in `.env`. If you
# need to override an environment variable that `.env` doesn't expose, fix
# compose.yml and `.env.example` instead of muddying up your override.
#
# The published ports come from `.env` too, since the URLs there have to
# agree with them. To move a service to another port, change `.env`, not this
# file.
#
# Production would use an override too, but a much smaller one: publish the
# proxy (and SFTPGo's SFTP port if it's in the stack), and redefine the news,
# batches, and issue-cache volumes as binds to absolute paths. No dev target,
# no source mount.

# Dev build: web, workers, and cli run the "dev" image target with your
# checkout mounted over the app directory. The entrypoint recompiles whatever
# binary a container runs, so the edit/compile/test loop is:
#
#   scripts/compose restart web workers
#
# Templates and static files are read straight from the checkout, so changes
# there only need a page reload.
#
# The named volumes keep Go's caches between runs, and keep the container's
# binaries out of your checkout's bin/ directory. Inline binds are normally
# off-limits, but a source mount is dev-only by definition.
x-nca-dev: &nca-dev
  build:
    target: dev
  volumes:
    - .:/usr/local/nca
    - go-cache:/root/.cache
    - dev-bin:/usr/local/nca/bin

services:
  # NCA, plus page images at /images/iiif. In dev, the browser talks straight
  # to the proxy, so it's published on PUBLIC_PORT.
  proxy:
    ports:
      - "${PUBLIC_PORT:?PUBLIC_PORT must be set}:80"

  web: *nca-dev
  workers: *nca-dev
  cli: *nca-dev

  # SFTPGo's web admin (login "admin", password "password" with the dev
  # seed), and SFTP for test uploads.
  #
  # Profiled services get interpolated even when their profile is off, so
  # their ports use defaults (matching `.env.example`) instead of `:?`.
  sftpgo:
    ports:
      - "${SFTPGO_WEB_PORT:-8081}:8080"
      - "${SFTPGO_SFTP_PORT:-2022}:2022"

  # ONI production and staging
  oni-prod:
    ports:
      - "${ONI_PROD_PORT:-8080}:80"
  oni-staging:
    ports:
      - "${ONI_STAGING_PORT:-8082}:80"

  # Uncomment for direct database access (e.g., a GUI client)
  #db:
  #  ports:
  #    - "127.0.0.1:3306:3306"

volumes:
  # Go build and module caches, and the dev image's compiled binaries
  go-cache: {}
  dev-bin: {}

  # Dev volumes live on the host, in DEV-VOLS, so you can look at and change
  # files directly. NCA's workflow tree is DEV-VOLS/news; `batches` is the same
  # tree's production-batches dir, separately mounted because ONI needs it.
  # (The test stack keeps its own tree in test/fakemount; see test/README.md.)
  # Put them anywhere you like: bin/ncadev reads the paths from here.
  #
  # These are bind mounts: the directories must exist (bin/ncadev creates
  # them), and removing the volumes won't delete their contents. driver_opts
  # are baked in when a volume is created, so if you move these directories
  # (or your checkout), remove these volumes.
  news:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/DEV-VOLS/news
  batches:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/DEV-VOLS/news/production-batches

  # The issue cache lives on the host so wiping the stack doesn't mean a long
  # (10+ minute) wait while NCA rebuilds it from the live site. The test stack
  # copies it to start its own cache.
  issue-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/DEV-VOLS/issue-cache
